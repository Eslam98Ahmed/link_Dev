<div class="container py-5 my-3">
    <div class="row">
        <div class="col-md-6">
            <div class="user-img d-flex justify-content-center align-items-center">
                <img [src]="item?.urlToImage" alt="User Image" class="w-100">
            </div>
        </div>
        <div class="col-md-6">
            <h4 class="user-name m-0 py-4"><span>{{item?.title}}</span></h4>
            <p class="text-muted pb-4">{{item?.description}}</p>
        </div>
    </div>
</div>
